<style>
  :root {
    --bg: #f6f7f5;
    --surface: #ffffff;
    --text: #1d2420;
    --muted: #5d6862;
    --border: #d9ded9;
    --accent: #2f7d4f;
    --accent-text: #ffffff;
    --ok-bg: #dcefe2;
    --ok-text: #1f5c37;
    --missing-bg: #f8dcdc;
    --missing-text: #8a2424;
    --error: #b42318;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.4;
  }

  header {
    padding: 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  header h1 { margin: 0; font-size: 1.25rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }

  main { padding: 16px; }

  .card {
    max-width: 520px;
    margin: 0 auto;
    padding: 20px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 0.95rem; }
  label .optional { font-weight: 400; color: var(--muted); }

  input[type="text"], input[type="file"], textarea, select {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
  }

  textarea { min-height: 70px; resize: vertical; }

  .type-switch { display: flex; gap: 8px; }
  .type-switch label {
    flex: 1;
    margin: 0;
    padding: 10px;
    text-align: center;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    font-weight: 500;
  }
  .type-switch input { position: absolute; opacity: 0; pointer-events: none; }
  .type-switch input:checked + span { color: var(--accent); font-weight: 700; }
  .type-switch label:has(input:checked) { border-color: var(--accent); background: var(--ok-bg); }

  button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    border: 0;
    border-radius: 6px;
    background: var(--accent);
    color: var(--accent-text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }

  .message { margin-top: 16px; padding: 12px; border-radius: 6px; }
  .message.error { background: var(--missing-bg); color: var(--error); }
  .message.success { background: var(--ok-bg); color: var(--ok-text); }

  .hidden { display: none !important; }
  .muted { color: var(--muted); }
</style>
